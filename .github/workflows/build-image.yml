name: Build and publish UniFi OS Server Docker image

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      uos_server_version:
        description: "latest, all, a stable version, or an explicit version with custom installers"
        default: latest
      installer_url_amd64:
        description: "Optional Ubiquiti Linux x64 installer URL for a preview"
      installer_sha256_amd64:
        description: "Vendor SHA-256 for the custom x64 installer"
      installer_url_arm64:
        description: "Optional Ubiquiti Linux arm64 installer URL for a preview"
      installer_sha256_arm64:
        description: "Vendor SHA-256 for the custom arm64 installer"
      image_name:
        description: "GHCR image name"
        default: unifi-os-server-docker
      push:
        description: "Publish the build to GHCR"
        type: boolean
        default: true
  push:
    branches: [main]
    paths: &build_paths
      - .github/workflows/build-image.yml
      - scripts/**
      - Dockerfile
      - .dockerignore
      - docker-compose.yaml
      - uos-entrypoint.sh
      - uos-logs.cjs
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  pull_request:
    paths: *build_paths

permissions:
  contents: read

concurrency:
  group: unifi-images-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

env:
  PUBLISH: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      image: ${{ steps.resolve.outputs.image }}
      latest: ${{ steps.resolve.outputs.latest }}
      build: ${{ steps.current.outputs.build || 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve version and installer digests
        id: resolve
        env:
          REQUESTED_VERSION: ${{ inputs.uos_server_version || 'latest' }}
          IMAGE_NAME: ${{ inputs.image_name || 'unifi-os-server-docker' }}
          INSTALLER_URL_AMD64: ${{ inputs.installer_url_amd64 }}
          INSTALLER_URL_ARM64: ${{ inputs.installer_url_arm64 }}
          INSTALLER_SHA256_AMD64: ${{ inputs.installer_sha256_amd64 }}
          INSTALLER_SHA256_ARM64: ${{ inputs.installer_sha256_arm64 }}
        run: python3 scripts/resolve-release.py
      - name: Sign in to GHCR for stable version check
        if: env.PUBLISH == 'true' && steps.resolve.outputs.latest != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check published stable version
        if: env.PUBLISH == 'true' && steps.resolve.outputs.latest != ''
        id: current
        env:
          IMAGE: ${{ steps.resolve.outputs.image }}
          CANDIDATE: ${{ steps.resolve.outputs.latest }}
        run: bash scripts/check-promotion.sh

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build image for native runner
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          provenance: false
          platforms: linux/${{ matrix.arch }}
          tags: unifi-os-server:smoke-test
          build-args: |
            INSTALLER_URL_AMD64=${{ matrix.url }}
            INSTALLER_URL_ARM64=${{ matrix.url }}
            INSTALLER_SHA256_AMD64=${{ matrix.sha256 }}
            INSTALLER_SHA256_ARM64=${{ matrix.sha256 }}
            UOS_SERVER_VERSION=${{ matrix.version }}
            UOS_SOURCE=https://github.com/${{ github.repository }}
      - name: Boot and check UniFi services
        run: bash scripts/smoke-test.sh unifi-os-server:smoke-test
      - name: Sign in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested image and record its digest
        if: env.PUBLISH == 'true'
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          VERSION: ${{ matrix.version }}
          TAG: ${{ matrix.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          ref="$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$TAG-$ARCH"
          docker tag unifi-os-server:smoke-test "$ref"
          docker push "$ref" | tee push.log
          digest=$(sed -nE 's/.*digest: (sha256:[[:xdigit:]]{64}) .*/\1/p' push.log)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          jq -n --arg tag "$TAG" --arg version "$VERSION" --arg arch "$ARCH" --arg digest "$digest" \
            '{tag: $tag, version: $version, arch: $arch, digest: $digest}' > "$TAG-$ARCH.json"
      - name: Save tested image digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.tag }}-${{ matrix.arch }}
          path: ${{ matrix.tag }}-${{ matrix.arch }}.json
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [plan, build]
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish version tags and promote the tested stable version
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          LATEST: ${{ needs.plan.outputs.latest }}
        run: bash scripts/publish-manifests.sh digests
