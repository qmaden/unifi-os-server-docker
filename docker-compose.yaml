services:
  unifi-os-server:
    container_name: unifi-os-server
    image: ${UNIFI_IMAGE:-ghcr.io/qmaden/unifi-os-server-docker:latest}
    cgroup: host
    restart: unless-stopped
    cap_add:
      - NET_RAW
      - NET_ADMIN
    ports:
      - "8080:8080" # HTTP inform / redirect
      - "8443:8443" # UniFi Controller API
      - "8444:8444" # Secure Portal for Hotspot
      - "8880-8882:8880-8882" # Hotspot portal redirection (HTTP)
      - "10003:10003/udp" # UniFi discovery (Only needed on local network)
      - "11443:443" # UniFi Web UI (HTTPS)
      - "3478:3478/udp" # STUN used for device poking
      - "5514:5514/udp" # Syslog
      - "6789:6789" # Speed test
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "host.containers.internal:host-gateway"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ./docker/uos:/var/lib/uosserver
      - ./docker/uos:/var/lib/unifi
      - ./docker/data/:/data
    tmpfs:
      - /run:exec
      - /run/lock
      - /tmp:exec
      - /var/log/journal
      - /var/opt/unifi/tmp:size=64m
      - /data/unifi-core/config/http
    networks:
      - unifi-os-server-network
    depends_on:
      unifi-os-server-mongodb:
        condition: service_healthy
    environment:
      TZ: Europe/Amsterdam
      UOS_SYSTEM_IP: ${UOS_SYSTEM_IP:-127.0.0.1}
      UOS_LOG_FORMAT: "text" # Default; set to "json" for structured log collectors.
      MONGO_INTERNAL: "false" # Defaults to false → uses the external MongoDB service below.

  unifi-os-server-mongodb:
    container_name: unifi-os-server-mongodb
    image: ${MONGO_IMAGE:-mongo:8.0}
    restart: unless-stopped
    environment:
      MONGO_ACCEPT_EXISTING_DATA: ${MONGO_ACCEPT_EXISTING_DATA:-false}
    entrypoint:
      - /bin/bash
      - -ec
      - |
        major=$$(mongod --version | sed -n 's/^db version v\([0-9][0-9]*\).*/\1/p')
        test -n "$$major"
        marker="/data/db/.uos-mongo-major-$$major"
        if [ "$$major" != 4 ] && [ ! -e "$$marker" ]; then
          if [ -n "$$(find /data/db -mindepth 1 -maxdepth 1 -print -quit)" ] &&
              [ "$$MONGO_ACCEPT_EXISTING_DATA" != true ]; then
            echo 'Existing MongoDB data detected. See docs/building.md before changing major versions.' >&2
            exit 1
          fi
          touch "$$marker"
        fi
        exec /usr/local/bin/docker-entrypoint.sh mongod
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if command -v mongosh >/dev/null; then shell=mongosh; else shell=mongo; fi;
          "$$shell" --quiet --eval 'quit(db.adminCommand({ping: 1}).ok === 1 ? 0 : 1)'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - unifi-os-server-network
    volumes:
      - ${MONGO_DATA_DIR:-./docker/mongodb}:/data/db

networks:
  unifi-os-server-network:
